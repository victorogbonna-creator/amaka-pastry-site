ckground:white;color:var(--orange);white-space:nowrap;position:relative;z-index:1}.footer{padding:52px 0 24px}.footer-top{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:30px;padding-bottom:35px}.footer p{max-width:250px;color:var(--muted);font-size:12px;line-height:1.7;margin-top:14px}.footer h4{font-size:12px;margin:6px 0 15px}.footer-links{display:grid;gap:11px;color:var(--muted);font-size:11px}.footer-links a:hover{color:var(--orange)}.copyright{display:flex;justify-content:space-between;gap:12px;border-top:1px solid #e9dfd4;padding-top:18px;color:var(--muted);font-size:10px}.banner{background:#f8eee1;padding:55px 0;text-align:center}.banner h1{font-size:clamp(42px,6vw,65px);margin:12px 0}.banner p{max-width:520px;margin:0 auto;color:var(--muted);font-size:14px;line-height:1.7}.contact-grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:38px}.contact-info{padding:30px;border-radius:21px;background:var(--green);color:white}.contact-info h3{font:700 27px 'Playfair Display',serif;margin:0 0 10px}.contact-info p{color:#e2efe6;font-size:12px;line-height:1.7}.contact-detail{padding:14px 0;border-top:1px solid #ffffff35;font-size:12px}.contact-detail b{display:block;margin-bottom:5px}.contact-form{display:grid;grid-template-columns:1fr 1fr;gap:14px}.contact-form label{font-size:11px;font-weight:800}.contact-form input,.contact-form textarea,.contact-form select{width:100%;padding:13px;margin-top:7px;border:1px solid #e5d9cb;border-radius:10px;background:#fffdfa;font:inherit;font-size:12px;outline-color:var(--orange)}.contact-form textarea{min-height:115px;resize:vertical}.full{grid-column:1/-1}.success{padding:12px;border-radius:10px;background:#e6f1e6;color:var(--green);font-size:12px;font-weight:700}.mobile-nav{display:none}

<body>
	<div id="root"></div>
	<script type="text/babel">
		const {useState}=React;
		const products=[
			{name:'Classic Meat Pie',cat:'Pastries',price:1200,tag:'Bestseller',rating:'4.9',desc:'Flaky golden crust, hearty beef filling.',img:'meatpie.jpg'},
			{name:'Sausage Roll',cat:'Pastries',price:900,tag:'Fan fave',rating:'4.8',desc:'Buttery pastry wrapped around juicy sausage.',img:'sausage roll.jpg'},
			{name:'Nigerian Egg Roll',cat:'Street bites',price:800,tag:'Fresh daily',rating:'4.9',desc:'Fluffy dough with a whole boiled egg inside.',img:'eggroll.jpg'},
			{name:'Sweet Buns',cat:'Pastries',price:500,tag:'Made today',rating:'4.7',desc:'Light, fluffy and just the right amount sweet.',img:'buns.jpg'},
			{name:'Chicken Shawarma',cat:'Street bites',price:3500,tag:'Big flavour',rating:'5.0',desc:'Chicken, crunchy veg and our creamy sauce.',img:'chicken shawarma.jpg'},
			{name:'Glazed Donut',cat:'Sweet treats',price:1000,tag:'New!',rating:'4.8',desc:'Pillowy soft, dipped in our signature glaze.',img:'donut.jpg'},
			{name:'Puff-Puff Box',cat:'Sweet treats',price:1500,tag:'Share the joy',rating:'4.9',desc:'Golden, airy bites dusted with a little sugar.',img:'images.jpg'},
			{name:'Chin Chin Crunch',cat:'Sweet treats',price:1200,tag:'Snack time',rating:'4.8',desc:'Crispy, crunchy, and impossible to stop eating.',img:'chinchin.jpg'},
		];
		const money=n=>'₦'+n.toLocaleString('en-NG');
		function App(){
			const [page,setPage]=useState('Home'),[filter,setFilter]=useState('All bites'),[cart,setCart]=useState(0),[mobile,setMobile]=useState(false),[sent,setSent]=useState(false);
			const go=p=>{setPage(p);setMobile(false);window.scrollTo({top:0,behavior:'smooth'})};
			const browse=()=>{if(page!=='Home')setPage('Home');setTimeout(()=>document.getElementById('menu')?.scrollIntoView({behavior:'smooth'}),70)};
			const categories=['All bites','Pastries','Street bites','Sweet treats'];
			const shown=filter==='All bites'?products:products.filter(p=>p.cat===filter);
			const links=['Home','Our menu','Our story','Contact'];
			const nav=x=>x==='Home'?go('Home'):x==='Our menu'?browse():x==='Our story'?go('Story'):go('Contact');
			function Header(){return <><div className="announcement">FRESHLY BAKED, ALWAYS WITH LOVE &nbsp; ✦ &nbsp; FREE DELIVERY OVER ₦15,000</div><header className="wrap header"><a href="#" className="brand" onClick={e=>{e.preventDefault();go('Home')}}><span className="brand-mark">A</span><span>Amaka Pastery<small>little bites, big joy</small></span></a><nav className="nav">{links.map(x=><button key={x} className={(page==='Home'&&x==='Home'||page==='Story'&&x==='Our story'||page==='Contact'&&x==='Contact')?'active':''} onClick={()=>nav(x)}>{x}</button>)}</nav><div className="head-actions"><button className="cart" aria-label="Basket">♡<span className="count">{cart}</span></button><button className="btn" onClick={browse}>Order now ↗</button><button className="menu-toggle" aria-label="Toggle navigation" onClick={()=>setMobile(!mobile)}>{mobile?'×':'☰'}</button></div></header>{mobile&&<nav className="mobile-nav">{links.map(x=><button key={x} onClick={()=>nav(x)}>{x}</button>)}</nav>}</>}
			function ProductGrid({limit}){return <><div className="filters">{categories.map(x=><button key={x} onClick={()=>setFilter(x)} className={'filter '+(filter===x?'selected':'')}>{x}</button>)}</div><div className="products">{shown.slice(0,limit||shown.length).map(p=><article className="product" key={p.name}><div className="product-image"><img src={p.img} alt={p.name} loading="lazy"/><span className="badge">{p.tag}</span></div><div className="product-info"><div className="product-title"><h3>{p.name}</h3><span className="rating">★ {p.rating}</span></div><p>{p.desc}</p><div className="product-bottom"><span className="price">{money(p.price)}</span><button className="add" aria-label={'Add '+p.name+' to basket'} onClick={()=>setCart(cart+1)}>+</button></div></div></article>)}</div></>}
			function Footer(){return <footer className="footer"><div className="wrap"><div className="footer-top"><div><a className="brand" href="#" onClick={e=>{e.preventDefault();go('Home')}}><span className="brand-mark">A</span><span>Amaka Pastery<small>little bites, big joy</small></span></a><p>Good days start with good snacks. Handmade with love, baked fresh for your happiest moments.</p></div><div><h4>Explore</h4><div className="footer-links"><a href="#menu" onClick={e=>{e.preventDefault();browse()}}>Our menu</a><a href="#story" onClick={e=>{e.preventDefault();go('Story')}}>Our story</a><a href="#contact" onClick={e=>{e.preventDefault();go('Contact')}}>Contact us</a></div></div><div><h4>Say hello</h4><div className="footer-links"><a href="mailto:hello@amakapastery.com">hello@amakapastery.com</a><a href="tel:+2348000000000">+234 800 000 0000</a><span>Lagos, Nigeria 🇳🇬</span></div></div><div><h4>Follow the yum</h4><div className="footer-links"><a href="#instagram">Instagram ↗</a><a href="#tiktok">TikTok ↗</a><a href="#whatsapp">WhatsApp ↗</a></div></div></div><div className="copyright"><span>© 2025 Amaka Pastery. Made with ♥ in Nigeria.</span><span>Fresh bites. Good vibes.</span></div></div></footer>}
			function Home(){return <><section className="hero"><div className="wrap hero-grid"><div><div className="eyebrow">Your happy place for snacks</div><h1>A little bite of <em className="accent">happiness.</em></h1><p className="hero-copy">From flaky meat pies to fluffy puff-puff, we make your favourite Nigerian treats fresh, joyful, and impossible to share.</p><div className="hero-buttons"><button className="btn" onClick={browse}>Explore the menu ↗</button><button className="btn outline" onClick={()=>go('Story')}>Our little story</button></div><div className="proof"><div className="faces"><span>😊</span><span>😋</span><span>🥰</span></div><div><div className="stars">★★★★★</div><div>Loved by 2,000+ happy snackers</div></div></div></div><div className="hero-art"><div className="hero-blob"></div><img className="hero-photo" src="shawama.jpg" alt="Golden freshly baked pastries"/><div className="float one">Made fresh daily<small>Goodness in every bite</small></div><div className="float two">★★★★★<small>Real ingredients. Real joy.</small></div></div></div></section><div className="ticker"><div><span>Fresh from our oven</span><b>✳</b><span>Made with love</span><b>✳</b><span>Big Nigerian flavour</span><b>✳</b><span>Good vibes only</span><b>✳</b><span>Fresh from our oven</span></div></div><section className="section" id="menu"><div className="wrap"><div className="section-heading"><div className="eyebrow">The good stuff</div><h2>Made for your <em className="accent">cravings.</em></h2><p>All your Nigerian favourites, handmade with quality ingredients and a generous sprinkle of joy.</p></div><ProductGrid limit={4}/><div className="center"><button className="btn dark" onClick={()=>go('Menu')}>See the full menu →</button></div></div></section><section className="section about"><div className="wrap about-grid"><div className="about-art"><img src="https://images.unsplash.com/photo-1555507036-ab1f4038808a?auto=format&fit=crop&w=900&q=85" alt="Fresh pastries prepared by hand" loading="lazy"/><div className="sticker">100%<br/>made with<br/>love ♥</div></div><div className="story-copy"><div className="eyebrow">A little about us</div><h2>We believe snacks should make you <span className="accent">smile.</span></h2><p>Amaka Pastery started with one simple idea: the snacks we grew up loving deserve to be made with care, shared with joy, and enjoyed any day of the week.</p><div className="values"><div className="value"><i>✿</i> Fresh every day<span>Never frozen, always fabulous.</span></div><div className="value"><i>♡</i> Made with love<span>Little details, big flavour.</span></div></div><button className="btn" onClick={()=>go('Story')}>Get to know us ↗</button></div></div></section><section className="testimonial"><div className="wrap"><div className="quote"><div className="stars">★★★★★</div><blockquote>“That meat pie took me straight back to my childhood. Except this one disappeared in about 30 seconds!”</blockquote><div className="quote-name">Tomi A.<small>Very happy snack lover</small></div></div></div></section><section className="wrap"><div className="cta"><div><div className="eyebrow">Good things are one click away</div><h2>Snack happy. Snack Amaka.</h2><p>Bring a little joy to your day. Your cravings called!</p></div><button className="btn" onClick={browse}>Let’s get snacking ↗</button></div></section></>}
			function MenuPage(){return <><section className="banner"><div className="eyebrow">Fresh from our kitchen</div><h1>Pick your <em className="accent">happy.</em></h1><p>From Nigerian classics to sweet little treats, there's a fresh favourite for everyone.</p></section><section className="section"><div className="wrap"><ProductGrid/></div></section></>}
			function StoryPage(){return <><section className="banner"><div className="eyebrow">The heart behind the treats</div><h1>Our story, <em className="accent">your joy.</em></h1><p>Good snacks bring people together. That’s the little idea that started it all.</p></section><section className="section"><div className="wrap about-grid"><div className="about-art"><img src="shawama.jpg" alt="Handmade fresh pastries"/><div className="sticker">Baked fresh<br/>in Lagos 🇳🇬</div></div><div className="story-copy"><div className="eyebrow">From our kitchen to you</div><h2>Made with heart. <span className="accent">Shared with joy.</span></h2><p>Amaka Pastery is all about familiar flavours that feel like home. We bring a fresh, playful twist to Nigeria's most-loved snacks, using quality ingredients and making every batch by hand.</p><p>Whether you're grabbing a quick sausage roll, sharing puff-puff with your people, or treating yourself to a donut, we're here to make your day a little brighter.</p><div className="values"><div className="value"><i>✿</i> Small-batch goodness<span>Freshly made, never mass-produced.</span></div><div className="value"><i>♡</i> Proudly Nigerian<span>Our classics, made with extra love.</span></div></div><button className="btn" onClick={browse}>Find your favourite ↗</button></div></div></section></>}
			function ContactPage(){return <><section className="banner"><div className="eyebrow">We'd love to hear from you</div><h1>Let's <em className="accent">talk snacks.</em></h1><p>Planning a party, have a question, or just want to say hi? Our inbox is always open.</p></section><section className="section"><div className="wrap contact-grid"><div className="contact-info"><h3>Say hello! 👋</h3><p>Drop us a note and a real human from our team will get back to you soon. For orders, call or WhatsApp us.</p><div className="contact-detail"><b>✉ Email</b>hello@amakapastery.com</div><div className="contact-detail"><b>☎ Phone / WhatsApp</b>+234 800 000 0000</div><div className="contact-detail"><b>⌖ Find us</b>Lagos, Nigeria 🇳🇬</div><div className="contact-detail"><b>◷ Opening hours</b>Mon–Sat, 8am – 7pm</div></div><form className="contact-form" onSubmit={e=>{e.preventDefault();setSent(true)}}><label>Your name<input required placeholder="e.g. Amaka Okafor"/></label><label>Email address<input type="email" required placeholder="you@example.com"/></label><label className="full">What can we help with?<select><option>Just saying hi!</option><option>Place an order</option><option>Party / catering enquiry</option><option>Something else</option></select></label><label className="full">Your message<textarea required placeholder="Tell us what's on your mind…"/></label>{sent&&<div className="success full">Thanks for reaching out! We'll be in touch soon. 💛</div>}<button className="btn full" type="submit">Send your message ↗</button></form></div></section></>}
			return <><Header/>{page==='Home'?<Home/>:page==='Menu'?<MenuPage/>:page==='Story'?<StoryPage/>:<ContactPage/>}<Footer/></>;
		}
		ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
	</script>
